<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Content desk</title>
<style>
:root{
  --bg:#000;
  --ink:#EFE6D2;
  --mute:#8F8975;
  --line:rgba(239,230,210,.16);
  --gold:#D4AF37;
  --red:#E5484D;
  --green:#46B96B;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans)}
main{max-width:640px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px 90px}
h1{font:600 30px/1.1 var(--serif);margin:0;letter-spacing:.2px}
h2{font:600 20px/1.2 var(--serif);margin:0 0 6px}
p{margin:0 0 10px}
.mute{color:var(--mute)}
.small{font-size:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
.who{font-size:14px;color:var(--mute);margin-top:4px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;min-height:44px;padding:0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 22px;border-radius:999px;background:var(--gold);color:#000;font-weight:600;box-shadow:0 0 18px rgba(212,175,55,.28)}
.btn[disabled]{opacity:.4;box-shadow:none;cursor:default}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.danger{background:var(--red);color:#fff;box-shadow:none}
.field{display:block;margin-bottom:16px}
.field span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
input[type=text],input[type=email],input[type=password],input[type=number],textarea{width:100%;background:none;border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:46px}
textarea{resize:vertical;line-height:1.45}
input::placeholder,textarea::placeholder{color:rgba(143,137,117,.7)}
.orgs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;scrollbar-width:none}
.orgs::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;white-space:nowrap}
.chip[aria-pressed=true]{border-color:var(--gold);background:rgba(212,175,55,.1)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.meter{margin-bottom:22px}
.ticks{display:flex;gap:4px;margin:8px 0 6px}
.tick{flex:1;height:8px;border-radius:2px;background:var(--line)}
.tick.on{background:var(--gold)}
.bar{height:8px;border-radius:2px;background:var(--line);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;background:var(--gold)}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{min-height:46px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--gold)}
.notice{border-left:3px solid var(--gold);padding:6px 12px;margin-bottom:16px;color:var(--ink)}
.notice.bad{border-left-color:var(--red)}
.batch{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.batch input{width:76px;text-align:center}
.item{padding:16px 0;border-bottom:1px solid var(--line)}
.item h3{font:600 18px/1.3 var(--serif);margin:0 0 4px}
.item .body{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:6px;white-space:pre-line}
.item .src{font-size:14px;color:var(--mute);word-break:break-all}
.item .err{font-size:14px;color:var(--red);margin-top:4px}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.acts .link{padding:0 10px 0 0}
.empty{padding:28px 0;color:var(--mute)}
.check{display:flex;align-items:center;gap:10px;min-height:44px;margin-bottom:12px}
.check input{width:20px;height:20px;accent-color:#D4AF37}
dialog{background:#000;color:var(--ink);border:1px solid var(--line);border-radius:18px;width:min(560px,calc(100vw - 24px));max-height:calc(100dvh - 24px);overflow-y:auto;padding:20px}
dialog::backdrop{background:rgba(0,0,0,.78)}
.dlg-acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.count{float:right;font-size:13px}
.count.over{color:var(--red)}
.quote{border-left:2px solid var(--line);padding-left:12px;margin:10px 0 4px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.media{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.media .btn{min-height:42px;padding:0 16px;font-size:15px}
.thumb{display:flex;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.thumb img,.thumb video{width:72px;height:72px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#0b0b0b}
.thumb audio{height:40px;max-width:100%}
.vthumb{position:relative;display:inline-block;width:72px;height:72px;border-radius:10px;background:#0b0b0b;border:1px solid var(--line);cursor:pointer;overflow:hidden;flex:none}
.vthumb img{width:100%;height:100%;border:0;border-radius:0}
.vplay{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px rgba(212,175,55,.45);pointer-events:none}
.vplay::before{content:"";position:absolute;left:11px;top:8px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent #000}
.bad{color:var(--red)}
.sep{border:0;border-top:1px solid var(--line);margin:26px 0 18px}
@media (prefers-reduced-motion:no-preference){.btn{transition:transform .12s}.btn:active{transform:scale(.97)}}
</style>
</head>
<body>
<main id="app"></main>
<dialog id="dlg"></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Meet Me content desk, version 2 (no scheduler; pictures, stickers and voice notes; source link optional).
   Signs in as a normal Meet Me account and posts as an organisation that account owns.
   The database enforces ownership, headers and the daily limit; this page only helps you fill the queue. */

const SUPABASE_URL = "https://ixdgthkovlkhdfrnqyav.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml4ZGd0aGtvdmxraGRmcm5xeWF2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxODM1MDIsImV4cCI6MjEwMzc1OTUwMn0.YWM40sBEVBB8_r1POB1ynnlVt4nrg7RdeMAn4aEISFA";
const HEADER_MAX = 60;
const GAP_MS = 1200;

// A separate storage key, so signing in here never touches the app's own session on the same site.
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { storageKey: "meetme-desk-auth", persistSession: true, autoRefreshToken: true }
});

function blankSingle() { return { header: "", body: "", link: "", stickerUrl: "", audioUrl: "", audioDur: 0 }; }
const state = {
  uid: null, meetNumber: "", orgs: [], orgId: null,
  items: [], tab: "queue", today: 0, busy: false,
  notice: null, draft: "", firstLineHeader: true, batch: 3, loginError: "",
  single: blankSingle()
};

const $app = document.getElementById("app");
const $dlg = document.getElementById("dlg");

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, "");
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) {
    if (k == null || k === false) continue;
    e.append(k.nodeType ? k : document.createTextNode(String(k)));
  }
  return e;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const curOrg = () => state.orgs.find((o) => o.id === state.orgId) || null;
const storeKey = () => "desk:v1:" + state.uid;
function save() { try { localStorage.setItem(storeKey(), JSON.stringify(state.items)); } catch (e) {} }
function load() {
  try { state.items = JSON.parse(localStorage.getItem(storeKey()) || "[]"); } catch (e) { state.items = []; }
}
function host(link) { try { return new URL(link).hostname.replace(/^www\./, ""); } catch (e) { return link; } }
function note(text, bad) { state.notice = text ? { text, bad: !!bad } : null; }

function lagosDayStartISO() {
  const day = new Date(Date.now() + 3600000).toISOString().slice(0, 10); // Lagos is UTC+1 all year
  return new Date(day + "T00:00:00+01:00").toISOString();
}

function validate(it, org) {
  if (!org) return "No organisation selected";
  const header = (it.header || "").trim();
  const link = (it.link || "").trim();
  if (header.length > HEADER_MAX) return "Header is " + header.length + " characters, the limit is " + HEADER_MAX;
  if (link && !/^https?:\/\/\S+$/i.test(link)) return "The link must start with http:// or https://";
  if (org.type === "newscast") {
    if (!header) return "News posts need a header";
  } else if (!header && !(it.body || "").trim() && !it.stickerUrl && !it.audioUrl) {
    return "Add a header, some text, a picture or a voice note";
  }
  return "";
}
function buildContent(it, org) {
  const parts = [];
  if ((it.body || "").trim()) parts.push(it.body.trim());
  if ((it.link || "").trim()) parts.push((org.type === "newscast" ? "Source: " : "") + it.link.trim());
  return parts.join("\n\n");
}
function friendly(msg) {
  msg = msg || "";
  if (/org_daily_limit/.test(msg)) return "Daily limit reached for this organisation";
  if (/org_header_required/.test(msg)) return "News posts need a header";
  if (/org_not_owner/.test(msg)) return "This account does not own that organisation";
  if (/violates check constraint.*header/i.test(msg)) return "Header is longer than " + HEADER_MAX + " characters";
  return msg;
}

/* ---------- parsing ---------- */
function parsePaste(text, firstLineHeader) {
  const t = text.replace(/\r\n?/g, "\n").trim();
  if (!t) return [];
  const chunks = /^\s*---\s*$/m.test(t) ? t.split(/^\s*---\s*$/m) : t.split(/\n\s*\n/);
  const out = [];
  for (const chunk of chunks) {
    const lines = chunk.split("\n").map((l) => l.trim()).filter(Boolean);
    if (!lines.length) continue;
    let link = "";
    const rest = [];
    for (const l of lines) {
      const m = l.match(/^(?:link|source|url)\s*:\s*(\S+)$/i);
      if (m) link = m[1];
      else if (/^https?:\/\/\S+$/i.test(l)) link = l;
      else rest.push(l);
    }
    let header = "", body = "";
    if (firstLineHeader) { header = rest[0] || ""; body = rest.slice(1).join("\n"); }
    else body = rest.join("\n");
    out.push({ header, body, link });
  }
  return out;
}
function parseCSV(text) {
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; }
      else cur += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(cur); cur = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(cur); cur = ""; rows.push(row); row = [];
    } else cur += c;
  }
  if (cur !== "" || row.length) { row.push(cur); rows.push(row); }
  const clean = rows.filter((r) => r.some((x) => x.trim()));
  if (!clean.length) return [];
  const head = clean[0].map((x) => x.trim().toLowerCase());
  const find = (names) => head.findIndex((x) => names.includes(x));
  const iH = find(["header", "title", "headline"]);
  const iB = find(["body", "text", "content", "summary"]);
  const iL = find(["link", "url", "source"]);
  if (iH < 0 && iB < 0) return [];
  return clean.slice(1).map((r) => ({
    header: (iH >= 0 ? r[iH] : "") || "",
    body: (iB >= 0 ? r[iB] : "") || "",
    link: (iL >= 0 ? r[iL] : "") || ""
  }));
}
function addItems(list) {
  const org = curOrg();
  const seen = new Set(state.items.filter((i) => i.orgId === org.id).map((i) => key(i)));
  let added = 0, skipped = 0;
  for (const raw of list) {
    const it = { id: crypto.randomUUID(), orgId: org.id, header: raw.header.trim(), body: raw.body.trim(), link: raw.link.trim(), stickerUrl: raw.stickerUrl || "", audioUrl: raw.audioUrl || "", audioDur: raw.audioDur || 0, status: "queued", error: "", postId: null, postedAt: null };
    if (!it.header && !it.body && !it.link && !it.stickerUrl && !it.audioUrl) continue;
    if (seen.has(key(it))) { skipped++; continue; }
    seen.add(key(it)); state.items.push(it); added++;
  }
  save();
  return { added, skipped };
}
const key = (i) => [i.header, i.body, i.link, i.stickerUrl || "", i.audioUrl || ""].join("|").toLowerCase();

/* ---------- data ---------- */
async function refreshToday() {
  const org = curOrg();
  if (!org) { state.today = 0; return; }
  const { count } = await sb.from("posts").select("id", { count: "exact", head: true })
    .eq("organization_id", org.id).gte("created_at", lagosDayStartISO());
  state.today = count || 0;
}
async function afterSignIn(session) {
  state.uid = session.user.id;
  const { data: me } = await sb.from("users").select("meet_number, display_number").eq("id", state.uid).maybeSingle();
  if (!me || Number(me.display_number) !== 8) {
    // The desk is for Meet 8 (Meet Founder) only.
    await sb.auth.signOut();
    state.uid = null; state.orgs = []; state.items = [];
    state.loginError = "The content desk is only for Meet 8.";
    render();
    return;
  }
  state.meetNumber = me.meet_number ? me.meet_number : "";
  const { data: orgs, error } = await sb.rpc("my_organizations");
  state.orgs = error ? [] : (orgs || []);
  state.orgId = state.orgs.length ? state.orgs[0].id : null;
  load();
  await refreshToday();
  render();
}
async function signIn(email, pin) {
  state.loginError = "";
  const { data, error } = await sb.auth.signInWithPassword({ email, password: pin });
  if (error || !data.session) { state.loginError = "That email and PIN did not work."; render(); return; }
  await afterSignIn(data.session);
}
async function signOut() { stopActiveRec(); await sb.auth.signOut(); state.uid = null; state.orgs = []; state.items = []; render(); }

async function postItem(it) {
  const org = state.orgs.find((o) => o.id === it.orgId);
  const bad = validate(it, org);
  if (bad) { it.error = bad; return { ok: false }; }
  const row = {
    user_id: state.uid, organization_id: org.id,
    content: buildContent(it, org) || null, header: it.header.trim() || null, post_type: "rant"
  };
  if (it.stickerUrl) row.sticker_url = it.stickerUrl;
  if (it.audioUrl) { row.audio_url = it.audioUrl; row.duration_seconds = it.audioDur || 0; }
  const { data, error } = await sb.from("posts").insert(row).select("id").single();
  if (error) { it.error = friendly(error.message); return { ok: false, limit: /org_daily_limit/.test(error.message || "") }; }
  it.status = "posted"; it.postId = data.id; it.postedAt = Date.now(); it.error = "";
  return { ok: true };
}
async function postMany(list) {
  state.busy = true; note(""); render();
  let done = 0, hitLimit = false;
  for (let i = 0; i < list.length; i++) {
    const r = await postItem(list[i]);
    save();
    if (r.ok) done++;
    note("Posting " + (i + 1) + " of " + list.length + "...");
    render();
    if (r.limit) { hitLimit = true; break; }
    if (i < list.length - 1) await sleep(GAP_MS);
  }
  await refreshToday();
  state.busy = false;
  if (hitLimit) note("Posted " + done + ". The daily limit was reached, so the rest stay in the queue.", true);
  else if (done < list.length) note("Posted " + done + " of " + list.length + ". Check the items marked in red.", true);
  else note("Posted " + done + (done === 1 ? " item." : " items."));
  render();
}

/* ---------- media (pictures, stickers, voice notes) ---------- */
// Same buckets and columns the app itself uses: "stickers" -> posts.sticker_url, "voice-notes" -> posts.audio_url.
const STICKER_ACCEPT = "image/*";
const VIDEO_ACCEPT = "video/webm,video/mp4";
const REC_MAX_SECONDS = 300;
let activeRec = null;
const fmt = (n) => Math.floor(n / 60) + ":" + String(n % 60).padStart(2, "0");
const isVid = (u) => /\.(mp4|webm)(\?|$)/i.test(u || "");
const posterOf = (u) => (u || "").replace(/\.(webm|mp4)(\?.*)?$/i, "-poster.jpg");
function mediaThumb(u) {
  if (!isVid(u)) return h("img", { src: u, alt: "" });
  // Videos show a still picture with a golden play button; the video itself only loads when tapped.
  const wrap = h("span", { class: "vthumb", role: "button", tabindex: "0", "aria-label": "Play video" },
    h("img", { src: posterOf(u), alt: "", onerror: (e) => { e.target.style.display = "none"; } }),
    h("span", { class: "vplay" }));
  const play = () => {
    const v = h("video", { src: u, controls: true, autoplay: true, playsinline: true, style: "width:160px;height:160px" });
    v.addEventListener("error", () => v.replaceWith(h("span", { class: "small mute" }, "This video has expired.")));
    wrap.replaceWith(v);
  };
  wrap.addEventListener("click", play);
  wrap.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); play(); } });
  return wrap;
}
function stopActiveRec() {
  if (!activeRec) return;
  const r = activeRec; activeRec = null; r.discard = true;
  clearInterval(r.timer);
  try { if (r.rec.state !== "inactive") r.rec.stop(); } catch (e) {}
  r.stream.getTracks().forEach((t) => t.stop());
}
function extFor(file, fallback) {
  const m = (file.name || "").match(/\.([a-z0-9]+)$/i);
  return (m ? m[1] : fallback).toLowerCase();
}
async function shrinkPhoto(file) {
  // Big phone photos are wasteful in a feed. Only plain JPEGs are touched; PNG, GIF, WebP and video stay exactly as they are.
  if (file.type !== "image/jpeg" || file.size < 1500000) return file;
  try {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale); c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob && blob.size < file.size ? blob : file;
  } catch (e) { return file; }
}
/* ---------- video: 30 seconds at most, trim front and back, shrink (same rules as the Meet Me app) ---------- */
const VIDEO_MAX_SECONDS = 30;
const VIDEO_SKIP_BYTES = 30 * 1024 * 1024;     // untrimmed clip up to 30 MB: upload exactly as filmed (instant, smooth, original sound)
const VIDEO_FALLBACK_MAX_BYTES = 30 * 1024 * 1024;
const VIDEO_MAX_W = 720, VIDEO_MAX_H = 960;
const VIDEO_BITS = 3000000, AUDIO_BITS = 128000;

// A small still picture of the first moment of the kept part. Feeds show this instead of the video.
async function captureVideoPoster(v, atTime) {
  try {
    await new Promise((res) => { v.onseeked = res; v.currentTime = atTime; setTimeout(res, 2000); });
    v.onseeked = null;
    const sc = Math.min(1, 360 / v.videoWidth, 360 / v.videoHeight);
    const c = document.createElement("canvas");
    c.width = Math.max(2, Math.round(v.videoWidth * sc)); c.height = Math.max(2, Math.round(v.videoHeight * sc));
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob(r, "image/jpeg", 0.7));
  } catch (e) { console.warn("Poster capture failed", e); return null; }
}

// Long video: pick which part to keep by dragging the front and back handles. Resolves { start, end } or null.
function pickVideoTrim(url, dur) {
  return new Promise((resolve) => {
    const MIN_LEN = 1, maxLen = Math.min(VIDEO_MAX_SECONDS, dur);
    let start = 0, end = maxLen;
    const tf = (t) => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
    const dlg = h("dialog", { "aria-label": "Trim your video" });
    const pv = h("video", { playsinline: true, style: "width:100%;max-height:260px;background:#000;border-radius:12px;display:block;margin-bottom:14px;object-fit:contain" });
    const rangeEl = h("div", { style: "position:absolute;top:18px;height:8px;border-radius:4px;background:var(--gold)" });
    const handleCss = "position:absolute;top:6px;width:28px;height:32px;margin-left:-14px;border-radius:8px;background:var(--gold);border:2px solid var(--ink);touch-action:none;cursor:ew-resize";
    const hS = h("div", { style: handleCss, role: "slider", "aria-label": "Start of the kept part" });
    const hE = h("div", { style: handleCss, role: "slider", "aria-label": "End of the kept part" });
    const track = h("div", { style: "position:relative;height:44px;margin:0 14px 8px;touch-action:none;user-select:none;-webkit-user-select:none" },
      h("div", { style: "position:absolute;left:0;right:0;top:18px;height:8px;border-radius:4px;background:var(--line)" }), rangeEl, hS, hE);
    const readout = h("div", { class: "small mute", style: "text-align:center;margin-bottom:6px" });
    const render = () => {
      const w = track.clientWidth || 1;
      hS.style.left = (start / dur * w) + "px"; hE.style.left = (end / dur * w) + "px";
      rangeEl.style.left = (start / dur * w) + "px"; rangeEl.style.width = ((end - start) / dur * w) + "px";
      readout.textContent = tf(start) + " – " + tf(end) + "  ·  " + Math.round(end - start) + "s kept of " + tf(dur);
    };
    const close = (result) => {
      pv.pause(); pv.ontimeupdate = null; pv.removeAttribute("src"); pv.load();
      dlg.close(); dlg.remove(); resolve(result);
    };
    const seekPlay = () => { try { pv.currentTime = start; pv.play().catch(() => {}); } catch (e) {} };
    const drag = (handle, which) => {
      handle.addEventListener("pointerdown", (ev) => {
        ev.preventDefault();
        handle.setPointerCapture(ev.pointerId);
        const rect = track.getBoundingClientRect();
        const move = (e2) => {
          const t = Math.min(dur, Math.max(0, (e2.clientX - rect.left) / rect.width * dur));
          if (which === "start") { start = Math.min(t, end - MIN_LEN); if (end - start > maxLen) end = start + maxLen; }
          else { end = Math.max(t, start + MIN_LEN); if (end - start > maxLen) start = end - maxLen; }
          start = Math.max(0, start); end = Math.min(dur, end);
          render();
          pv.currentTime = which === "start" ? start : Math.max(start, end - 0.3);
        };
        const up = () => { handle.removeEventListener("pointermove", move); handle.removeEventListener("pointerup", up); handle.removeEventListener("pointercancel", up); seekPlay(); };
        handle.addEventListener("pointermove", move); handle.addEventListener("pointerup", up); handle.addEventListener("pointercancel", up);
      });
    };
    drag(hS, "start"); drag(hE, "end");
    pv.addEventListener("timeupdate", () => { if (pv.currentTime >= end || pv.currentTime < start - 0.5) seekPlay(); });
    pv.addEventListener("loadedmetadata", () => { render(); seekPlay(); });
    pv.src = url;
    dlg.append(
      h("h2", {}, "Trim your video"),
      h("p", { class: "small mute" }, "Drag the left and right handles to cut the front and back. Up to " + VIDEO_MAX_SECONDS + " seconds."),
      pv, track, readout,
      h("div", { class: "dlg-acts" },
        h("button", { class: "btn", type: "button", onclick: () => close({ start, end }) }, "Use this part"),
        h("button", { class: "btn ghost", type: "button", onclick: () => close(null) }, "Cancel")));
    dlg.addEventListener("cancel", (e) => { e.preventDefault(); close(null); });   // Esc
    document.body.append(dlg);
    dlg.showModal();
    render();
  });
}

// Checks the length, lets the person trim a long clip, then re-records it smaller on this device.
// Returns { file } or { error } or { cancelled: true }. onProgress(text) is optional.
async function prepareVideoForUpload(file, onProgress) {
  const say = onProgress || (() => {});
  const url = URL.createObjectURL(file);
  const v = document.createElement("video");
  v.src = url; v.preload = "auto"; v.playsInline = true; v.muted = false;
  let trimmed = false, poster = null;
  try {
    await new Promise((res, rej) => { v.onloadedmetadata = res; v.onerror = () => rej(new Error("unreadable")); });
    const dur = v.duration;
    if (!isFinite(dur) || dur <= 0) return { error: "Could not read that video." };
    let startT = 0, endT = dur;
    if (dur > VIDEO_MAX_SECONDS + 0.5) {
      const pick = await pickVideoTrim(url, dur);
      if (!pick) return { cancelled: true };
      startT = pick.start; endT = pick.end; trimmed = true;
    }
    const clipLen = endT - startT;
    poster = await captureVideoPoster(v, Math.min(startT + 0.3, Math.max(startT, endT - 0.1)));
    if (!trimmed && file.size <= VIDEO_SKIP_BYTES) return { file, poster };

    const mime = ["video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm"]
      .find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m));
    const canCapture = !!mime && !!HTMLCanvasElement.prototype.captureStream && (window.AudioContext || window.webkitAudioContext);
    if (!canCapture) {
      if (trimmed) return { error: "This browser can't trim videos. Try a clip that is " + VIDEO_MAX_SECONDS + " seconds or shorter." };
      return file.size <= VIDEO_FALLBACK_MAX_BYTES ? { file, poster } : { error: "That video is too big. Try a shorter or smaller one." };
    }

    const scale = Math.min(1, VIDEO_MAX_W / v.videoWidth, VIDEO_MAX_H / v.videoHeight);
    const w = Math.max(2, Math.round(v.videoWidth * scale / 2) * 2), hh = Math.max(2, Math.round(v.videoHeight * scale / 2) * 2);
    const canvas = document.createElement("canvas"); canvas.width = w; canvas.height = hh;
    const g = canvas.getContext("2d");
    let directV = [];
    try { const cs = v.captureStream ? v.captureStream() : (v.mozCaptureStream ? v.mozCaptureStream() : null); if (cs) directV = cs.getVideoTracks(); } catch (e) {}
    const useCanvas = !directV.length;
    const tracks = useCanvas ? canvas.captureStream(30).getTracks() : [...directV];
    let ctx = null;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      ctx = new AC();
      if (ctx.state === "suspended") await ctx.resume();
      const src = ctx.createMediaElementSource(v);
      const dest = ctx.createMediaStreamDestination();
      src.connect(dest);                       // not connected to the speakers: nothing is heard while it shrinks
      tracks.push(...dest.stream.getAudioTracks());
    } catch (e) { console.warn("Shrink: no sound track, clip will be silent", e); }

    const rec = new MediaRecorder(new MediaStream(tracks), { mimeType: mime, videoBitsPerSecond: VIDEO_BITS, audioBitsPerSecond: AUDIO_BITS });
    const chunks = [];
    rec.ondataavailable = (ev) => { if (ev.data && ev.data.size) chunks.push(ev.data); };
    const done = new Promise((res) => { rec.onstop = res; });

    let raf = 0, stopped = false;
    const finish = () => { if (stopped) return; stopped = true; cancelAnimationFrame(raf); if (rec.state !== "inactive") rec.stop(); };
    const draw = () => { if (useCanvas) g.drawImage(v, 0, 0, w, hh); if (trimmed && v.currentTime >= endT) { finish(); return; } if (!stopped) raf = requestAnimationFrame(draw); };
    v.onended = finish;
    const safety = setTimeout(finish, (clipLen + 5) * 1000);
    const tick = setInterval(() => { say("Preparing video... " + Math.max(0, Math.min(99, Math.round((v.currentTime - startT) / clipLen * 100))) + "%"); }, 400);

    say("Preparing video...");
    {   // jump back to the chosen front before recording starts (the poster picture moved the playhead)
      await new Promise((res) => { v.onseeked = res; v.currentTime = startT; setTimeout(res, 2000); });
      v.onseeked = null;
    }
    rec.start(500);
    try { await v.play(); } catch (e) { v.muted = true; await v.play(); }   // browser refused sound: clip is silent
    draw();
    await done;
    clearTimeout(safety); clearInterval(tick);
    if (ctx) ctx.close().catch(() => {});

    const blob = new Blob(chunks, { type: "video/webm" });
    if (!blob.size) return file.size <= VIDEO_FALLBACK_MAX_BYTES && !trimmed ? { file, poster } : { error: "Could not prepare that video." };
    if (!trimmed && blob.size >= file.size) return { file, poster };   // never make an untrimmed clip bigger
    return { file: new File([blob], "sticker.webm", { type: "video/webm" }), poster };
  } catch (e) {
    console.error("Video prepare failed:", e);
    return file.size <= VIDEO_FALLBACK_MAX_BYTES && !trimmed ? { file, poster } : { error: "Could not prepare that video. Try a smaller one." };
  } finally {
    v.pause(); URL.revokeObjectURL(url);
  }
}

// Pictures and videos ("stickers") go to Cloudflare R2 through the meetme-upload Worker. Voice notes still go to Supabase.
const STICKER_UPLOAD_WORKER = "https://meetme-upload.abolainemmanuel.workers.dev";
async function uploadToR2(path, blob) {
  const { data: { session } } = await sb.auth.getSession();
  if (!session) throw new Error("Not signed in");
  const res = await fetch(STICKER_UPLOAD_WORKER + "/?path=" + encodeURIComponent(path), {
    method: "PUT", headers: { Authorization: "Bearer " + session.access_token }, body: blob
  });
  const out = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(out.error || ("Upload failed (" + res.status + ")"));
  return out.url;
}
async function uploadMedia(bucket, blob, ext, type, name) {
  const path = state.uid + "/" + (name || Date.now()) + "." + ext;
  if (bucket === "stickers") return uploadToR2(path, blob);
  // cacheControl = one year, so a phone that has seen this file once never downloads it again
  const { error } = await sb.storage.from(bucket).upload(path, blob, { contentType: type, cacheControl: "31536000" });
  if (error) throw error;
  return sb.storage.from(bucket).getPublicUrl(path).data.publicUrl;
}
function audioLength(file) {
  return new Promise((resolve) => {
    const a = new Audio(), u = URL.createObjectURL(file);
    const done = (n) => { URL.revokeObjectURL(u); resolve(n); };
    a.preload = "metadata";
    a.onloadedmetadata = () => done(isFinite(a.duration) ? Math.round(a.duration) : 0);
    a.onerror = () => done(0);
    setTimeout(() => done(0), 4000);
    a.src = u;
  });
}
// m is any object with stickerUrl, audioUrl, audioDur. The editor uploads straight away and keeps only the public URLs on m.
function mediaEditor(m, onChange) {
  const box = h("div", {});
  const status = h("div", { class: "small mute", style: "margin:0 0 12px", role: "status" });
  let busy = false, recStart = 0;
  const say = (t, bad) => { status.textContent = t || ""; status.className = "small " + (bad ? "bad" : "mute"); };
  const fire = () => { if (onChange) onChange(); draw(); };
  const failed = (err) => say("Upload failed: " + ((err && err.message) || err), true);

  const pictureIn = h("input", { type: "file", accept: STICKER_ACCEPT, style: "display:none", onchange: async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    busy = true; say("Uploading picture..."); draw();
    try {
      let small, posterBlob = null;
      small = await shrinkPhoto(f);
      const stamp = Date.now();
      m.stickerUrl = await uploadMedia("stickers", small, small === f ? extFor(f, "png") : "jpg", small.type || f.type, stamp);
      say("");
    } catch (err) { failed(err); }
    busy = false; fire();
  } });
  const videoIn = h("input", { type: "file", accept: VIDEO_ACCEPT, style: "display:none", onchange: async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    busy = true; say("Checking video..."); draw();
    try {
      const r = await prepareVideoForUpload(f, (t) => say(t));
      if (r.cancelled) { say(""); busy = false; draw(); return; }
      if (r.error) { say(r.error, true); busy = false; draw(); return; }
      say("Uploading video...");
      const small = r.file, posterBlob = r.poster || null;
      const isNewVid = small !== f && small.type === "video/webm";
      const stamp = Date.now();
      m.stickerUrl = await uploadMedia("stickers", small, isNewVid ? "webm" : extFor(f, "mp4"), small.type || f.type, stamp);
      if (posterBlob) {
        try { await uploadMedia("stickers", posterBlob, "jpg", "image/jpeg", stamp + "-poster"); } catch (er) { console.warn("Poster upload failed", er); }
      }
      say("");
    } catch (err) { failed(err); }
    busy = false; fire();
  } });
  const audioIn = h("input", { type: "file", accept: "audio/*", style: "display:none", onchange: async (e) => {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    busy = true; say("Uploading voice note..."); draw();
    try {
      const dur = await audioLength(f);
      m.audioUrl = await uploadMedia("voice-notes", f, extFor(f, "webm"), f.type || "audio/webm");
      m.audioDur = dur; say("");
    } catch (err) { failed(err); }
    busy = false; fire();
  } });

  async function toggleRec() {
    if (activeRec && activeRec.owner === box) { activeRec.rec.stop(); return; }
    stopActiveRec();
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch (err) { say("Could not reach the microphone. Check the browser's permission for this site.", true); draw(); return; }
    const rec = new MediaRecorder(stream), chunks = [];
    const r = { rec, stream, discard: false, timer: null, owner: box };
    rec.ondataavailable = (ev) => { if (ev.data.size) chunks.push(ev.data); };
    rec.onstop = async () => {
      clearInterval(r.timer);
      stream.getTracks().forEach((t) => t.stop());
      if (activeRec === r) activeRec = null;
      if (r.discard) return;
      const secs = Math.max(1, Math.round((Date.now() - recStart) / 1000));
      const type = (rec.mimeType || "audio/webm").split(";")[0];
      const blob = new Blob(chunks, { type });
      busy = true; say("Uploading voice note..."); draw();
      try {
        m.audioUrl = await uploadMedia("voice-notes", blob, type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm", type);
        m.audioDur = secs; say("");
      } catch (err) { failed(err); }
      busy = false; fire();
    };
    activeRec = r; recStart = Date.now(); rec.start();
    r.timer = setInterval(() => {
      const secs = Math.round((Date.now() - recStart) / 1000);
      say("Recording " + fmt(secs) + ". Tap Stop when you are done.");
      if (secs >= REC_MAX_SECONDS) rec.stop();
    }, 500);
    say("Recording 0:00. Tap Stop when you are done."); draw();
  }

  function draw() {
    const recording = !!(activeRec && activeRec.owner === box);
    box.replaceChildren(
      m.stickerUrl ? h("div", { class: "thumb" }, mediaThumb(m.stickerUrl),
        h("button", { class: "link", type: "button", style: "color:var(--red)", disabled: busy, onclick: () => { m.stickerUrl = ""; fire(); } }, "Remove picture or video")) : null,
      m.audioUrl ? h("div", { class: "thumb" }, h("audio", { controls: true, src: m.audioUrl, preload: "metadata" }),
        h("span", { class: "small mute" }, fmt(m.audioDur || 0)),
        h("button", { class: "link", type: "button", style: "color:var(--red)", disabled: busy, onclick: () => { m.audioUrl = ""; m.audioDur = 0; fire(); } }, "Remove voice note")) : null,
      h("div", { class: "media" },
        !m.stickerUrl ? h("button", { class: "btn ghost", type: "button", disabled: busy || recording, onclick: () => pictureIn.click() }, "Add picture or sticker") : null,
        !m.stickerUrl ? h("button", { class: "btn ghost", type: "button", disabled: busy || recording, onclick: () => videoIn.click() }, "Add video") : null,
        !m.audioUrl ? h("button", { class: "btn ghost", type: "button", disabled: busy, onclick: toggleRec }, recording ? "Stop recording" : "Record voice note") : null,
        !m.audioUrl && !recording ? h("button", { class: "btn ghost", type: "button", disabled: busy, onclick: () => audioIn.click() }, "Upload audio file") : null),
      status, pictureIn, videoIn, audioIn);
  }
  box.isBusy = () => busy || !!(activeRec && activeRec.owner === box);
  draw();
  return box;
}

  const finish = (r, wasSingle) => {
    note("Added " + r.added + (r.added === 1 ? " item" : " items") + (r.skipped ? ", skipped " + r.skipped + " duplicates" : "") + ".");
    if (r.added) { if (wasSingle) state.single = blankSingle(); else state.draft = ""; state.tab = "queue"; }
    render();
  };
  return h("div", {},
    h("h2", {}, "One post"),
    h("p", { class: "mute small" }, "Text, a picture or sticker, a voice note, or any mix. A source link is optional." +
      (org.type === "newscast" ? " News posts need a header." : "")),
    h("label", { class: "field" }, h("span", {}, "Header", count), hdr),
    h("label", { class: "field" }, h("span", {}, "Text"), body),
    h("label", { class: "field" }, h("span", {}, "Link"), link),
    ed,
    h("div", { class: "dlg-acts", style: "margin-top:0" },
      h("button", { class: "btn", disabled: state.busy, onclick: () => { const raw = checked(); if (raw) finish(addItems([raw]), true); } }, "Add to queue"),
      h("button", { class: "btn ghost", disabled: state.busy, onclick: () => {
        const raw = checked(); if (!raw) return;
        const r = addItems([raw]);
        if (!r.added) { note("That exact post is already in the queue.", true); render(); return; }
        const it = state.items[state.items.length - 1];
        state.single = blankSingle(); state.tab = "queue";
        postMany([it]);
      } }, "Post now")),

    h("hr", { class: "sep" }),
    h("h2", {}, "Paste several at once"),
    h("p", { class: "mute small" }, "Separate items with a line of three dashes, or with a blank line. A line that is just a link, or starts with link:, becomes the source. To add a picture or voice note to a pasted item, tap Edit on it in the queue."),
    h("label", { class: "field" }, h("span", {}, "Paste items"), ta),
    h("label", { class: "check" }, chk, "First line of each item is the header"),
    h("div", { class: "dlg-acts", style: "margin-top:0" },
      h("button", { class: "btn", onclick: () => {
        const rows = parsePaste(state.draft, state.firstLineHeader);
        if (!rows.length) { note("Nothing to add yet.", true); render(); return; }
        finish(addItems(rows));
      } }, "Add to queue"),
      h("button", { class: "btn ghost", onclick: () => file.click() }, "Upload a CSV")),
    file,
    h("p", { class: "small mute", style: "margin-top:16px" }, "CSV columns: header, body, link. Items are saved on this device until you post or delete them. Pictures and voice notes are uploaded the moment you add them.")
  );
}

function viewPosted(org) {
  const done = state.items.filter((i) => i.orgId === org.id && i.status === "posted").sort((a, b) => b.postedAt - a.postedAt);
  if (!done.length) return h("div", { class: "empty" }, "Nothing posted from the desk yet.");
  return h("div", {}, done.map((it) => h("div", { class: "item" },
    it.header ? h("h3", {}, it.header) : null,
    it.body ? h("div", { class: "body" }, it.body) : null,
    it.stickerUrl ? h("div", { class: "thumb" }, mediaThumb(it.stickerUrl)) : null,
    it.audioUrl ? h("div", { class: "thumb" }, h("audio", { controls: true, src: it.audioUrl, preload: "none" })) : null,
    h("div", { class: "src" }, "Posted " + new Date(it.postedAt).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" })),
    h("div", { class: "acts" },
      h("button", { class: "link", style: "color:var(--red)", onclick: () =>
        openConfirm("Remove from the app?", "This deletes the live post. It cannot be undone.", snippet(it), "Remove post", "Keep it", async () => {
          const { data, error } = await sb.from("posts").delete().eq("id", it.postId).select("id");
          if (error || !data || !data.length) { note("Could not remove that post" + (error ? ": " + error.message : "."), true); }
          else { state.items = state.items.filter((x) => x.id !== it.id); save(); await refreshToday(); note("Post removed."); }
          render();
        }) }, "Remove from app")))));
}

function viewDesk() {
  const org = curOrg();
  const root = h("div", {},
    h("div", { class: "top" },
      h("div", {}, h("h1", {}, "Content desk"), h("div", { class: "who" }, state.meetNumber ? "Signed in as " + state.meetNumber : "Signed in")),
      h("div", { style: "display:flex;flex-direction:column;align-items:flex-end" },
        h("a", { class: "link", href: "/", style: "display:inline-flex;align-items:center" }, "Back to Meet Me"),
        h("button", { class: "link", onclick: signOut }, "Sign out")))
  );
  if (!org) {
    root.append(h("p", {}, "This account does not own an organisation yet."),
      h("p", { class: "mute small" }, "Create one and claim it with its invite code in the app, then reopen this page."));
    return root;
  }
  root.append(
    h("div", { class: "orgs", role: "group", "aria-label": "Organisation" },
      state.orgs.map((o) => h("button", { class: "chip", "aria-pressed": String(o.id === state.orgId), onclick: async () => {
        stopActiveRec(); state.orgId = o.id; note(""); await refreshToday(); render();
      } }, h("span", { class: "dot", style: "background:" + (o.crest_color || "#D4AF37") }), o.name))),
    viewMeter(org)
  );
  const nQ = state.items.filter((i) => i.orgId === org.id && i.status !== "posted").length;
  const nP = state.items.filter((i) => i.orgId === org.id && i.status === "posted").length;
  const tabs = [["queue", "Queue (" + nQ + ")"], ["add", "Add"], ["posted", "Posted (" + nP + ")"]];
  root.append(h("div", { class: "tabs", role: "tablist" },
    tabs.map(([k, label]) => h("button", { class: "tab", role: "tab", "aria-selected": String(state.tab === k), onclick: () => { stopActiveRec(); state.tab = k; note(""); render(); } }, label))));
  if (state.notice) root.append(h("div", { class: "notice" + (state.notice.bad ? " bad" : ""), role: "status" }, state.notice.text));
  root.append(state.tab === "add" ? viewAdd(org) : state.tab === "posted" ? viewPosted(org) : viewQueue(org));
  return root;
}

function render() {
  const y = window.scrollY;
  $app.replaceChildren(state.uid ? viewDesk() : viewLogin());
  window.scrollTo(0, y);
}

/* ---------- start ---------- */
(async function init() {
  const { data } = await sb.auth.getSession();
  if (data.session) await afterSignIn(data.session); else render();
})();
</script>
</body>
</html>
